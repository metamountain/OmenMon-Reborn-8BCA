<!doctype html>
<meta charset="utf-8">
<title>GPU load</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:13px system-ui;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:8px;left:10px}</style>
<canvas id="c"></canvas>
<div id="hud">warming up…</div>
<script>
// Deliberately expensive fragment shader: a long unrolled loop of transcendental
// work per pixel, at full canvas resolution, driven every frame. The aim is a
// steady, sustained GPU load to warm the die - not a benchmark.
const cv = document.getElementById('c'), hud = document.getElementById('hud');
const gl = cv.getContext('webgl');
if (!gl) { hud.textContent = 'no webgl'; throw new Error('no webgl'); }

const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const fs = `precision highp float;
uniform float t; uniform vec2 r;
void main(){
  vec2 uv = gl_FragCoord.xy / r;
  float a = 0.0;
  for (int i = 0; i < 220; i++) {
    float f = float(i) * 0.017 + t;
    a += sin(uv.x * 40.0 + f) * cos(uv.y * 40.0 - f);
    a += sqrt(abs(sin(a * 1.7 + f))) * 0.5;
    a = fract(a * 1.13 + 0.31);
  }
  gl_FragColor = vec4(fract(a), fract(a * 3.1), fract(a * 7.3), 1.0);
}`;
function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(pr); gl.useProgram(pr);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uT = gl.getUniformLocation(pr, 't'), uR = gl.getUniformLocation(pr, 'r');

let frames = 0, t0 = performance.now(), last = t0;
function draw(now) {
  cv.width = cv.clientWidth; cv.height = cv.clientHeight;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(uR, cv.width, cv.height);
  gl.uniform1f(uT, (now - t0) / 1000);
  // Several passes per frame so the GPU stays busy between vsyncs
  for (let k = 0; k < 6; k++) gl.drawArrays(gl.TRIANGLES, 0, 3);
  frames++;
  if (now - last > 1000) {
    hud.textContent = 'load running · ' + frames + ' fps · ' + cv.width + '×' + cv.height;
    frames = 0; last = now;
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
